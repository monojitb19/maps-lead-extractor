<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 220px; margin: 0; padding: 14px 22px 10px; font-family: "Segoe UI", Arial, sans-serif; background: #fff; }
  #count { text-align: center; font-size: 16px; color: #222; margin: 2px 0 14px; }
  button { display: block; width: 100%; padding: 10px 0; margin: 0 0 14px; border: none; border-radius: 6px;
           color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(0.93); }
  button:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
  button:disabled { opacity: 0.6; cursor: default; }
  #start { background: #28a745; }
  #start.stop { background: #dc3545; }
  #export { background: #5dade2; }
  #clear { background: #3f5fb5; margin-bottom: 8px; }
  #searchRow { display: flex; gap: 6px; margin: 0 0 14px; }
  #q { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-family: inherit; }
  #q:focus { outline: none; border-color: #3f5fb5; box-shadow: 0 0 0 2px rgba(63,95,181,.2); }
  #searchBtn { width: 38px; margin: 0; padding: 0; background: #3f5fb5; display: flex; align-items: center; justify-content: center; }
  #status { font-size: 11px; color: #666; text-align: center; min-height: 14px; }
</style>
</head>
<body>
  <div id="searchRow">
    <input id="q" type="text" placeholder="e.g. steel traders Howrah" autofocus>
    <button id="searchBtn" title="Search on Google Maps" aria-label="Search on Google Maps">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </button>
  </div>
  <div id="count">Leads: 0</div>
  <button id="start">Start Auto Extract</button>
  <button id="export" disabled>Export Leads (0)</button>
  <button id="clear">Clear</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
